name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    - name: Build
      run: cargo build --release --locked --verbose

    - name: Package
      run: |
        name="qca-sim-${GITHUB_REF_NAME}-linux-x86_64"
        mkdir "$name"
        cp target/release/qca-sim README.md LICENSE "$name"/
        cp -r examples "$name"/
        tar -czf "$name.tar.gz" "$name"
        sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
        echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" \
          --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
