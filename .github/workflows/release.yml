name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    steps:
    - uses: actions/checkout@v7

    - name: Build
      run: cargo build --release --locked --verbose

    - name: Package Linux
      if: runner.os == 'Linux'
      run: |
        name="qca-sim-${GITHUB_REF_NAME}-linux-x86_64"
        mkdir "$name"
        cp target/release/qca-sim README.md LICENSE "$name"/
        cp -r examples "$name"/
        tar -czf "$name.tar.gz" "$name"
        sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      shell: bash

    - name: Package Windows
      if: runner.os == 'Windows'
      run: |
        $name = "qca-sim-$env:GITHUB_REF_NAME-windows-x86_64"
        New-Item -ItemType Directory -Path $name | Out-Null
        Copy-Item target/release/qca-sim.exe, README.md, LICENSE -Destination $name
        Copy-Item examples -Destination $name -Recurse
        $archive = "${name}.zip"
        Compress-Archive -Path $name -DestinationPath $archive
        $checksum = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
        "$checksum  $archive" | Out-File -Encoding ascii "${archive}.sha256"
      shell: pwsh

    - name: Upload release assets
      uses: actions/upload-artifact@v4
      with:
        name: release-assets-${{ matrix.platform }}
        path: qca-sim-${{ github.ref_name }}-${{ matrix.platform }}.*

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4.1.3
      with:
        pattern: release-assets-*
        merge-multiple: true
        path: release-assets

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" release-assets/* \
          --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
