name: Release

# A tag v* builds qca-sim and publishes a GitHub release with
#   * packaged binaries for Linux x86_64 and Windows (with README, LICENSE and examples),
#   * statically linked Linux binaries qca-sim-linux-x86_64 and qca-sim-linux-aarch64,
#     which run on any Linux system including HPC compute nodes (hpc/frida/install.sh
#     downloads them), and
#   * the container image ghcr.io/<owner>/qcasim:<version> (and :latest) for
#     linux/amd64 and linux/arm64.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish assets for, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Build
      run: cargo build --release --locked --verbose

    - name: Package Linux
      if: runner.os == 'Linux'
      run: |
        name="qca-sim-${RELEASE_TAG}-linux-x86_64"
        mkdir "$name"
        cp target/release/qca-sim README.md LICENSE "$name"/
        cp -r examples "$name"/
        tar -czf "$name.tar.gz" "$name"
        sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      shell: bash

    - name: Package Windows
      if: runner.os == 'Windows'
      run: |
        $name = "qca-sim-$env:RELEASE_TAG-windows-x86_64"
        New-Item -ItemType Directory -Path $name | Out-Null
        Copy-Item target/release/qca-sim.exe, README.md, LICENSE -Destination $name
        Copy-Item examples -Destination $name -Recurse
        $archive = "${name}.zip"
        Compress-Archive -Path $name -DestinationPath $archive
        $checksum = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
        "$checksum  $archive" | Out-File -Encoding ascii "${archive}.sha256"
      shell: pwsh

    - name: Upload release assets
      uses: actions/upload-artifact@v4
      with:
        name: release-assets-${{ matrix.platform }}
        path: qca-sim-${{ env.RELEASE_TAG }}-${{ matrix.platform }}.*

  static:
    name: Static ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: qca-sim-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: qca-sim-linux-aarch64
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Build (glibc linked statically)
      env:
        RUSTFLAGS: -C target-feature=+crt-static
      run: cargo build --release --locked -p qca-sim --target ${{ matrix.target }}

    - name: Smoke test
      run: |
        bin=target/${{ matrix.target }}/release/qca-sim
        file "$bin"
        "$bin" --version
        "$bin" robustness plan examples/line.qcd hpc/frida/examples/line-geometry.json --tasks 4

    - name: Rename
      run: |
        mkdir -p dist
        cp target/${{ matrix.target }}/release/qca-sim dist/${{ matrix.asset }}
        (cd dist && sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256)

    - uses: actions/upload-artifact@v4
      with:
        name: release-assets-${{ matrix.asset }}
        path: dist/${{ matrix.asset }}*

  release:
    runs-on: ubuntu-latest
    needs: [build, static]
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4.1.3
      with:
        pattern: release-assets-*
        merge-multiple: true
        path: release-assets

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" --generate-notes --verify-tag
        fi
        gh release upload "$RELEASE_TAG" release-assets/* --clobber

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: static
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RELEASE_TAG }}

    - uses: actions/download-artifact@v4.1.3
      with:
        pattern: release-assets-qca-sim-linux-*
        merge-multiple: true
        path: dist

    - name: Name the binaries by Docker architecture
      run: |
        mv dist/qca-sim-linux-x86_64 dist/qca-sim-linux-amd64
        mv dist/qca-sim-linux-aarch64 dist/qca-sim-linux-arm64
        chmod +x dist/qca-sim-linux-amd64 dist/qca-sim-linux-arm64

    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image tags
      id: meta
      run: |
        image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qcasim
        echo "tags=$image:${RELEASE_TAG#v},$image:latest" >> "$GITHUB_OUTPUT"

    - uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.release
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
