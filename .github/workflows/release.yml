name: Release

# A tag v* builds qca-sim for every platform, publishes a GitHub release with
# the platform archives (.tar.gz on Linux/macOS, .zip on Windows, each holding
# qca-sim, LICENSE and README.md) plus the HPC scripts, and pushes the container image ghcr.io/<owner>/qcasim:<version>
# (and :latest). workflow_dispatch builds the artifacts but never publishes a
# release. The Linux binaries are statically linked (musl), so they run
# on any Linux system, including HPC compute nodes (see hpc/frida/README.md).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: qca-sim-linux-x86_64
            archive: qca-sim-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: qca-sim-linux-aarch64
            archive: qca-sim-linux-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: qca-sim-windows-x86_64.exe
            archive: qca-sim-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: qca-sim-macos-aarch64
            archive: qca-sim-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: qca-sim-macos-x86_64
            archive: qca-sim-macos-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked -p qca-sim --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/qca-sim
          "$bin" --version
          "$bin" robustness plan examples/line.qcd hpc/frida/examples/line-geometry.json -n 4

      - name: Rename
        shell: bash
        run: |
          mkdir -p dist
          suffix=""; [[ "${{ matrix.target }}" == *windows* ]] && suffix=".exe"
          cp "target/${{ matrix.target }}/release/qca-sim$suffix" "dist/${{ matrix.asset }}"

      - name: Package the release archive
        shell: bash
        run: |
          suffix=""; [[ "${{ matrix.target }}" == *windows* ]] && suffix=".exe"
          mkdir -p stage package
          cp "target/${{ matrix.target }}/release/qca-sim$suffix" LICENSE README.md stage/
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            (cd stage && 7z a -tzip "../package/${{ matrix.archive }}" .)
          else
            tar czf "package/${{ matrix.archive }}" -C stage .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 3

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.archive }}
          path: package/${{ matrix.archive }}
          retention-days: 3

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true

      - name: Package the HPC scripts
        run: tar czf artifacts/qcasim-hpc-scripts.tar.gz hpc

      - name: Create GitHub release
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: QCASim ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            artifacts/qca-sim-linux-x86_64.tar.gz
            artifacts/qca-sim-linux-aarch64.tar.gz
            artifacts/qca-sim-macos-aarch64.tar.gz
            artifacts/qca-sim-macos-x86_64.tar.gz
            artifacts/qca-sim-windows-x86_64.zip
            artifacts/qcasim-hpc-scripts.tar.gz

  container:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: qca-sim-*
          merge-multiple: true

      - name: Name the binaries by Docker architecture
        run: |
          mv dist/qca-sim-linux-x86_64 dist/qca-sim-linux-amd64
          mv dist/qca-sim-linux-aarch64 dist/qca-sim-linux-arm64
          chmod +x dist/qca-sim-linux-*

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qcasim
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=$image:${GITHUB_REF_NAME#v},$image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:edge" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
